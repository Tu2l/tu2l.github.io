# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: tu2l/Zoltraak # Replace with the private repository owner/name
          ref: tu2l.com # Replace with the branch name you want to pull
          path: external_repo # The directory where the external repository will be checked out
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v3  # Or the appropriate version
        with:
          node-version: 'v22.14.0'   # Or your required Node.js version

      - name: Install dependencies
        run: npm install
        working-directory: ./external_repo # adjust the path

      - name: Build
        run: npm run build
        working-directory: ./external_repo # adjust the path

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the built static files
          path: ./external_repo/out  # Replace with the actual path to your built static files

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
